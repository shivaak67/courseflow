spring:
  datasource:
    url: jdbc:h2:mem:prioritize;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

app:
  cors:
    origins: http://localhost:4200
  jwt:
    secret: test-jwt-secret-key-at-least-32-chars-long
    expiration-ms: 86400000
  oauth:
    google:
      enabled: false
  canvas:
    mock-enabled: true
    base-url: https://canvas.test
    api-token: test-token
