spring:
  application:
    name: prioritize-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth:
    success-redirect: ${APP_OAUTH_SUCCESS_REDIRECT:http://localhost:4200/auth/callback}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    mock: ${TWILIO_MOCK:true}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
