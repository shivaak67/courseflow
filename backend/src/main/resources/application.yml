spring:
  application:
    name: prioritize-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
