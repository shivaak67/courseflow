spring:
  application:
    name: prioritize-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}

prioritize:
  scoring:
    weights:
      urgency: 0.35
      points: 0.20
      difficulty: 0.15
      workload: 0.15
      personal-priority: 0.15
    thresholds:
      critical: 80
      high: 60
      medium: 40
    defaults:
      no-due-date-urgency: 35
      missing-points: 40
      missing-difficulty: 50
      missing-workload: 40
      missing-personal-priority: 50
      max-workload-hours: 20
      max-absolute-points: 100
      urgency-horizon-days: 14
      urgency-floor: 15
